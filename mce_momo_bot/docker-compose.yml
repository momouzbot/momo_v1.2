services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mce_user
      POSTGRES_PASSWORD: mce_pass
      POSTGRES_DB: mce_momo
    ports:
      - "5432:5432"
    volumes:
      - mce_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mce_postgres_data:
